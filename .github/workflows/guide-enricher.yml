name: Guide Enricher

on:
  push:
    branches:
      - main
      - pdgeek-production
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run guide enricher tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'
