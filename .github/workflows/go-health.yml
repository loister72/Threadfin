name: Go Health

on:
  push:
    branches:
      - main
      - pdgeek-production
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Vet And Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Vet
        run: go vet -mod=mod ./...

      - name: Test
        run: go test -mod=mod ./...

      - name: Shell syntax
        run: bash -n tools/*.sh
